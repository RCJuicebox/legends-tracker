name: Release

# Pushing a tag like v1.1.0 builds the Windows installer from that commit and publishes it as a GitHub
# Release, which installed copies then update to. `npm run release` pushes the tag.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds the installer and attaches it
# to the run as an artifact, publishing nothing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Check the tag matches package.json
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The release exists as a draft before electron-builder uploads to it: its uploads run in parallel
      # and would otherwise race to create the release.
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft \
            --title "$version" \
            --notes "Legends Tracker $version. Download Legends-Tracker-Setup-$version.exe below; installed copies update themselves."

      - run: npx electron-vite build

      - name: Build the installer
        run: npx electron-builder --win --publish ${{ env.PUBLISH == 'true' && 'always' || 'never' }}

      - name: Publish once every file is up
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for need in latest.yml "Legends-Tracker-Setup-$version.exe" "Legends-Tracker-Setup-$version.exe.blockmap"; do
            echo "$assets" | grep -qxF "$need" || { echo "::error::$need did not upload; the release is left as a draft"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Keep the installer from a dry run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
