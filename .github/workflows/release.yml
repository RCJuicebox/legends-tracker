name: Release

# Pushing a tag like v1.1.0 builds the Windows installer from that commit and publishes it as a GitHub
# Release, which installed copies then update to. `npm run release` pushes the tag.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds the installer and attaches it
# to the run as an artifact, publishing nothing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# GitHub now and then starts two runs for one tag push (2.3.0 got two). Run side by side they each
# made a draft, and the publish step found the empty one. A second run for a tag waits for the first
# here, then finds the release published and builds nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether this version is out already: then there is nothing to build. A second build would upload to
  # the published release all over again, taking its files down while it replaces them.
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.look.outputs.published }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=false
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ] &&
            [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            published=true
            echo "::notice::$GITHUB_REF_NAME is published already; nothing to build."
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # What CI runs: typecheck, lint, the format check and the tests.
      - run: npm run check

      - name: Check the tag matches package.json
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The release exists as a draft before electron-builder uploads to it: its uploads run in parallel
      # and would otherwise race to create the release.
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$version" > release-notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft \
            --title "$version" \
            --notes-file release-notes.md

      - run: npx electron-vite build
      # The built app starts on a throwaway profile and quits when asked, before anything is uploaded.
      - run: npm run smoke

      - name: Build the installer
        run: npx electron-builder --win --publish ${{ env.PUBLISH == 'true' && 'always' || 'never' }}

      # The packaged app too (its file list is what tests and the source run never see; 1.2.0 shipped
      # without koffi's JavaScript). The release is still a draft here: a failure leaves it one.
      - name: Start the packaged app
        run: node scripts/smoke.mjs "dist/win-unpacked/Legends Tracker.exe"

      # The release for this tag that has every file, by its id: a stray draft for the same tag (one an
      # earlier run left) is passed over rather than looked at by tag name.
      - name: Publish once every file is up
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          need="latest.yml Legends-Tracker-Setup-$version.exe Legends-Tracker-Setup-$version.exe.blockmap"
          id=''
          for rid in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --jq '.[].name')
            ok=true
            for n in $need; do echo "$assets" | grep -qxF "$n" || ok=false; done
            if [ "$ok" = true ]; then
              id=$rid
              break
            fi
          done
          if [ -z "$id" ]; then
            echo "::error::No $GITHUB_REF_NAME release has latest.yml, the installer and its blockmap; it is left as a draft"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true >/dev/null
          echo "Published release $id"

      - name: Keep the installer from a dry run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
