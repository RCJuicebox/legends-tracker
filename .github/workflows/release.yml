name: Release

# Pushing a tag like v1.1.0 builds the Windows installer from that commit and publishes it as a GitHub
# Release, which installed copies then update to. `npm run release` pushes the tag.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds the installer and attaches it
# to the run as an artifact, publishing nothing.
#
# The token that can write releases goes only to the publish job, which runs no npm: the dependency
# install and the test toolchain (hundreds of packages' install scripts) build with a read-only token and
# no credentials left in the checkout, and hand the files over as an artifact (LT-509). Actions are
# pinned by commit; Dependabot keeps the pins current.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# GitHub now and then starts two runs for one tag push (2.3.0 got two). Run side by side they each
# made a draft, and the publish step found the empty one. A second run for a tag waits for the first
# here, then finds the release published and builds nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether this version is out already: then there is nothing to build. A second build would upload to
  # the published release all over again, taking its files down while it replaces them.
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.look.outputs.published }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=false
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ] &&
            [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            published=true
            echo "::notice::$GITHUB_REF_NAME is published already; nothing to build."
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

  # Builds and tests with no token at all: nothing here can touch the repository or its releases.
  build:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # What CI runs: typecheck, lint, the format check and the tests.
      - run: npm run check

      - id: version
        name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npx electron-vite build
      # The built app starts on a throwaway profile and quits when asked, before anything is uploaded.
      - run: npm run smoke

      # Never published from here: the installer, its blockmap and latest.yml are handed to the publish job.
      - name: Build the installer
        run: npx electron-builder --win --publish never

      # The packaged app too (its file list is what tests and the source run never see; 1.2.0 shipped
      # without koffi's JavaScript).
      - name: Start the packaged app
        run: node scripts/smoke.mjs "dist/win-unpacked/Legends Tracker.exe"

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 14
          if-no-files-found: error

  # The one job with a token that can write releases: it checks out only to read the changelog, installs
  # nothing, and uploads what the build job handed over.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      # The release exists as a draft before anything is uploaded to it, and stays one until every file is up.
      - name: Create the draft release
        run: |
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft \
            --title "$VERSION" \
            --notes-file release-notes.md

      - name: Upload the files
        run: gh release upload "$GITHUB_REF_NAME" dist/latest.yml "dist/Legends-Tracker-Setup-$VERSION.exe" "dist/Legends-Tracker-Setup-$VERSION.exe.blockmap" --clobber

      # The release for this tag that has every file, by its id: a stray draft for the same tag (one an
      # earlier run left) is passed over rather than looked at by tag name.
      - name: Publish once every file is up
        run: |
          need="latest.yml Legends-Tracker-Setup-$VERSION.exe Legends-Tracker-Setup-$VERSION.exe.blockmap"
          id=''
          for rid in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets" --jq '.[].name')
            ok=true
            for n in $need; do echo "$assets" | grep -qxF "$n" || ok=false; done
            if [ "$ok" = true ]; then
              id=$rid
              break
            fi
          done
          if [ -z "$id" ]; then
            echo "::error::No $GITHUB_REF_NAME release has latest.yml, the installer and its blockmap; it is left as a draft"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true >/dev/null
          echo "Published release $id"
