name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reads the code, writes nothing: a pull request's run gets no more than it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck, lint (with the layer rules) and the tests.
      - run: npm run check
      # The tests again with coverage: a folder falling below its floor in vitest.config.mts fails.
      - run: npm run coverage
      # The app starts on a throwaway profile, answers app:state and quits when asked: built from
      # source, then packaged as the installer would lay it out.
      - run: npm run build
      - run: npm run smoke
      - run: npx electron-builder --win --dir --publish never
      - run: node scripts/smoke.mjs "dist/win-unpacked/Legends Tracker.exe"
