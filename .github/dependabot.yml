# Monthly pull requests for outdated dependencies. Majors of Electron, koffi (native FFI) and the
# build chain deserve a look before merging: CI runs the type-check and tests on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        patterns: ['vite', 'vitest', '@vitejs/*', 'electron-vite', 'typescript', '@types/*']
    # electron-vite 5 accepts Vite 7 at most, and plugin-react 6 needs Vite 8, so `npm ci` fails on
    # either. Remove both entries once electron-vite 6 is a stable release (only 6.0.0-beta.1 on 2026-09-25).
    ignore:
      - dependency-name: 'vite'
        versions: ['>= 8']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>= 6']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
