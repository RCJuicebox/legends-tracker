# Monthly pull requests for outdated dependencies. Majors of Electron, koffi (native FFI) and the
# build chain deserve a look before merging: CI runs the type-check and tests on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        patterns: ['vite', 'vitest', '@vitejs/*', 'electron-vite', 'typescript', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
