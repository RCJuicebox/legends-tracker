<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Legends Tracker: a countdown ring (spell timers) around a faceted mote. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.55" stop-color="#e8b44c"/>
      <stop offset="1" stop-color="#b9822a"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff0e4"/>
      <stop offset="1" stop-color="#2fa597"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a8ff"/>
      <stop offset="1" stop-color="#8a4fc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3d7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fe3d7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- countdown ring: 80% remaining, gap at the top -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="40"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linecap="round"
          stroke-dasharray="814 1018" transform="rotate(-72 256 256)"/>
  <!-- tick mark at twelve o'clock -->
  <rect x="244" y="54" width="24" height="44" rx="12" fill="url(#gold)"/>
  <!-- the mote -->
  <circle cx="256" cy="262" r="118" fill="url(#glow)"/>
  <polygon points="256,158 336,262 256,366 176,262" fill="url(#gemL)"/>
  <polygon points="256,158 336,262 256,366" fill="url(#gemR)"/>
  <polygon points="256,158 296,262 256,366 216,262" fill="#ffffff" fill-opacity="0.18"/>
  <polygon points="176,262 336,262 256,366" fill="#000000" fill-opacity="0.18"/>
  <polygon points="256,158 216,262 176,262" fill="#ffffff" fill-opacity="0.25"/>
</svg>
